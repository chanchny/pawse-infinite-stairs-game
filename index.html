<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>무한의 멍계단</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
:root{--bg:#1a1033;--y:#ffd23f;--p:#ff6fb5;--b:#3bd1ff;--g:#5ee07a;--r:#ff5a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{background:var(--bg);color:#fff;font-family:'Galmuri11','Malgun Gothic',sans-serif;min-height:100vh;display:flex;justify-content:center;user-select:none;-webkit-user-select:none}
.app{width:100%;max-width:480px;padding:16px}
.screen{display:none;flex-direction:column;align-items:center;gap:12px;text-align:center}
.screen.on{display:flex}
h1{font-family:'Press Start 2P',monospace;font-size:22px;line-height:1.5;margin:8px 0 0;color:var(--y);text-shadow:3px 3px 0 #000}
h2{font-size:18px;margin:4px 0;color:var(--y)}
p.note{font-size:13px;line-height:1.6;margin:0;color:#cfc3ff}
.btn{font:inherit;font-size:15px;color:#111;background:var(--y);border:4px solid #000;box-shadow:0 4px 0 #000,inset -4px -4px 0 rgba(0,0,0,.2),inset 4px 4px 0 rgba(255,255,255,.4);padding:10px 14px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000,inset -4px -4px 0 rgba(0,0,0,.2),inset 4px 4px 0 rgba(255,255,255,.4)}
.btn.big{font-size:17px;padding:14px 18px;width:100%}
.btn.pink{background:var(--p)} .btn.blue{background:var(--b)} .btn.green{background:var(--g)} .btn.gray{background:#d8d2ee}
.btn.sel{background:var(--g)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.row label{font-size:12px;display:flex;align-items:center;gap:6px}
input[type=range]{width:110px}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#vp{width:100%;max-width:400px;aspect-ratio:1;overflow:auto;border:4px solid #000;background:#888}
#edit{display:block;width:100%;touch-action:none;image-rendering:auto;background:conic-gradient(#ccc 25%,#fff 0 50%,#ccc 0 75%,#fff 0) 0 0/20px 20px}
#preview{background:#2a1a80;border:4px solid #000;display:block}
#pvWrap{position:relative;width:336px;max-width:100%}
.pad2{position:absolute;right:10px;top:10px;display:none;grid-template-columns:repeat(3,26px);gap:2px;background:rgba(0,0,0,.4);padding:3px;border:2px solid #000}
.pad2.on{display:grid}
.pad2 .btn{padding:0;height:26px;font-size:11px;border-width:2px;box-shadow:0 1px 0 #000}
#q,.inp{font:inherit;font-size:16px;width:100%;padding:12px;border:4px solid #000;background:#fff;color:#111}
.list{display:flex;flex-direction:column;gap:6px;width:100%}
.rrow{display:flex;gap:8px;align-items:center;background:#2a1a80;border:3px solid #000;padding:10px;cursor:pointer;width:100%;font-size:14px;text-align:left}
.mini{width:70px;height:60px;flex:none;background:#1a1033;border:2px solid #000}
.rrow b{width:30px;color:var(--y)} .rrow span{flex:1;word-break:break-all} .rrow em{font-style:normal;color:var(--g)}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.item{padding:3px;background:#2a1a80;border:3px solid #000;cursor:pointer;touch-action:manipulation}
.item.on{background:var(--g)}
.item canvas{width:100%;display:block}
.item span{display:block;font-size:10px;color:#fff;margin-top:2px}
.item.on span{color:#111}
.sw{width:34px;height:34px;border:4px solid #000;padding:0;cursor:pointer}
.sw.on{outline:3px solid #fff}
.pad{display:grid;grid-template-columns:repeat(3,44px);gap:4px}
.pad .btn{padding:6px 0;font-size:16px}
.gamewrap{position:relative;width:100%;display:flex;justify-content:center}
#game{height:min(calc(100vh - 160px),640px);height:min(calc(100dvh - 160px),640px);max-width:100%;background:#120c3d;border:4px solid #000;touch-action:none}
#over{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,5,40,.82);padding:20px}
#over.on{display:flex}
#over .big{font-family:'Press Start 2P',monospace;font-size:28px;color:var(--y);text-shadow:3px 3px 0 #000}
#over .btn{width:200px;padding:7px 10px}
#over{gap:6px}
.ctrl{display:flex;gap:10px;width:100%}
.ctrl .btn{flex:1;font-size:24px;padding:12px 0}
.top{display:flex;justify-content:space-between;width:100%}
.small{font-size:12px;padding:6px 10px}
/* ---- 한 화면에 들어가도록 컴팩트하게 ---- */
body{min-height:100vh;min-height:100dvh}
.app{padding:10px 14px}
.screen{gap:8px}
#bgCv{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100%,60vh);width:min(100%,60dvh);height:100%;object-fit:cover;z-index:-1;display:none;image-rendering:pixelated}
#bgCv.on{display:block}
body.titleBg::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(10,5,40,.45) 0%,rgba(10,5,40,.6) 35%,rgba(10,5,40,.6) 55%,rgba(10,5,40,.1) 75%,rgba(10,5,40,.6) 100%)}
#scrLogin.on{min-height:calc(100vh - 20px);min-height:calc(100dvh - 20px);justify-content:center;padding-bottom:8vh;padding-bottom:8dvh}
#titlePanel{width:min(100%,calc(60vh - 28px));width:min(100%,calc(60dvh - 28px));display:flex;flex-direction:column;align-items:center;gap:20px;padding:22px 6px 24px;background:rgba(0,0,0,.6);border:3px solid rgba(255,255,255,.18);box-shadow:0 0 0 3px rgba(0,0,0,.6)}
.logo{position:fixed;left:50%;bottom:2.5vh;bottom:2.5dvh;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;display:block}
.ttl.big{white-space:nowrap}
.ttl.big .l1{font-size:min(5.4vw,3.3vh,24px);font-size:min(5.4vw,3.3dvh,24px)} .ttl.big .l2{font-size:min(4vw,2.4vh,17px);font-size:min(4vw,2.4dvh,17px);margin-top:6px}
.ttl{font-family:'Press Start 2P',monospace;text-transform:uppercase;margin:0;line-height:1.7;color:var(--y);text-shadow:3px 3px 0 #000;font-weight:normal}
.ttl .l1{display:block;font-size:clamp(11px,4.6vw,20px);color:#fff}
.ttl .l2{display:block;font-size:clamp(10px,4.1vw,17px)}
.ttl.sm .l1{font-size:clamp(9px,3.4vw,13px)} .ttl.sm .l2{font-size:clamp(9px,3.2vw,12px)}
#titlePanel{container-type:inline-size;background:none;border:none;box-shadow:none;gap:1cqw;padding:4cqw 4cqw 0;position:relative}
#titlePanel::before{content:"";position:absolute;left:-2cqw;right:-2cqw;top:0;bottom:-2cqw;z-index:-1;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.62) 0,rgba(0,0,0,.5) 55%,rgba(0,0,0,0) 100%);pointer-events:none}
.hero{margin:0;width:100%;display:flex;flex-direction:column;align-items:center;font-family:'Press Start 2P',monospace;font-weight:normal;text-transform:uppercase;text-align:center}
.hero .titleSvg{width:100%;height:auto;display:block;overflow:visible}
.hero .titleSvg text{font-family:'Press Start 2P',monospace;text-anchor:middle}
.hero .titleSvg .x{stroke-width:6;stroke-linejoin:round;paint-order:stroke}
.hero .titleSvg .g{fill:#EFE4FF;stroke:#EFE4FF;stroke-width:16;stroke-linejoin:round}
.hero .titleSvg .o{fill:#120224;stroke:#120224;stroke-width:6;stroke-linejoin:round}
.hero .titleSvg .f{stroke:none}
.hero .sub{font-size:3.6cqw;color:#F2E6FF;letter-spacing:.35em;margin-right:-.35em;text-shadow:0 0 1.2cqw rgba(190,150,255,.55);margin-bottom:8cqw}
#startBox{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
#startBtn{width:62%;font-family:'Press Start 2P',monospace;font-size:clamp(12px,4.2vw,17px);padding:14px 10px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#fff3a8}}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,5,40,.78);padding:16px}
.modal.on{display:flex}
.card{position:relative;width:100%;max-width:380px;background:#2a1a80;border:4px solid #000;box-shadow:0 6px 0 #000;padding:18px 16px 14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.xbtn{position:absolute;right:6px;top:6px;padding:2px 9px;font-size:14px}
.pager{display:flex;align-items:stretch;gap:4px;width:100%}
.pager .pgmid{flex:1;min-width:0}
.pg{width:28px;flex:none;padding:0;font-size:16px;align-self:stretch}
.pg[disabled]{opacity:.3;box-shadow:0 4px 0 #000}
.dots{display:flex;justify-content:center;gap:5px;height:8px;margin-top:5px}
.dots i{width:6px;height:6px;background:#6b58c8;border:1px solid #000}
.dots i.on{background:var(--y)}
.item.ph{visibility:hidden;pointer-events:none}
#scrDress h2,#scrBreed h2{font-size:15px;margin:0}
#scrDress .note{font-size:11px;min-height:1.3em;line-height:1.3}
#pvRow{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
#pvWrap{flex:none;width:min(62%,calc(clamp(130px,27vh,288px)*1.1667));width:min(62%,calc(clamp(130px,27dvh,288px)*1.1667))}
#pvRow .pad2{position:static;display:grid;grid-template-columns:repeat(3,34px);gap:3px;padding:4px;opacity:.3;pointer-events:none;flex:none}
#pvRow .pad2.on{opacity:1;pointer-events:auto}
#pvRow .pad2 .btn{height:34px;font-size:13px}
.nw{flex-wrap:nowrap;gap:4px}
.nw .btn{flex:1;padding:6px 2px;font-size:11px;white-space:nowrap}
#tabs{flex-wrap:nowrap;gap:3px}
#tabs .btn{flex:1;min-width:0;padding:6px 0;font-size:12px;border-width:3px}
#scrDress .item span,#scrBreed .item span{font-size:10px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scrStart .ttl{margin-top:2px}
#heroCv{height:min(288px,30vh)!important;height:min(288px,30dvh)!important;width:auto!important;aspect-ratio:3/4}
@media (max-height:680px){.item canvas{width:78%;margin:0 auto}}
</style>
</head>

const PER=8; // 한 페이지에 보여줄 개수
function makePager(gridId,dotsId,prevId,nextId){
  const grid=$(gridId),dots=$(dotsId),prev=$(prevId),next=$(nextId),P={page:0,nodes:[]};
  const pages=()=>Math.max(1,Math.ceil(P.nodes.length/PER));
  P.go=d=>{P.page=Math.max(0,Math.min(pages()-1,P.page+d));P.draw();};
  P.set=nodes=>{P.nodes=nodes;if(P.page>=pages())P.page=pages()-1;P.draw();};
  P.draw=()=>{
    grid.innerHTML='';
    const part=P.nodes.slice(P.page*PER,(P.page+1)*PER);
    part.forEach(n=>grid.appendChild(n));
    for(let i=part.length;i<PER&&pages()>1;i++){ // 빈 칸으로 높이 유지
      const d=document.createElement('div');d.className='item ph';
      const c=document.createElement('canvas');c.width=c.height=32;d.appendChild(c);
      const s=document.createElement('span');s.innerHTML='&nbsp;';d.appendChild(s);grid.appendChild(d);
    }
    const n=pages();
    dots.innerHTML=n>1?Array.from({length:n},(_,i)=>`<i class="${i===P.page?'on':''}"></i>`).join(''):'';
    prev.style.visibility=next.style.visibility=n>1?'visible':'hidden';
    prev.disabled=P.page===0;next.disabled=P.page>=n-1;
  };
  prev.onclick=()=>P.go(-1);next.onclick=()=>P.go(1);
  let sx=null; // 좌우로 밀어서 넘기기
  grid.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
  grid.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>40)P.go(dx<0?1:-1);});
  return P;
}

// 얼굴 사진의 실제 위치에 맞춰 아이템 기본 위치를 자동 보정 (샘플 강아지 기준)
function bounds(c){ // 24칸 기준 좌표로 환산한 불투명 영역
  const n=c.width,d=c.getContext('2d').getImageData(0,0,n,n).data,k=24/n;let t=n,b=-1,l=n,r=-1;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(d[(y*n+x)*4+3]>20){if(y<t)t=y;if(y>b)b=y;if(x<l)l=x;if(x>r)r=x;}
  return{t:t*k,b:b*k,l:l*k,r:r*k};
}

// 옷장 목록용: 강아지 없이 아이템만 그린 썸네일
function thumb(rects){
  if(!rects.length)rects=[['#888',0,0,1,1],['#888',1,1,1,1],['#888',2,2,1,1],['#888',2,0,1,1],['#888',0,2,1,1]];
  const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');
  let a=1e9,b=1e9,e=-1e9,f=-1e9;
  rects.forEach(([,rx,ry,w,h])=>{a=Math.min(a,rx);b=Math.min(b,ry);e=Math.max(e,rx+w);f=Math.max(f,ry+h);});
  const w=e-a,h=f-b,k=Math.max(1,Math.floor(28/Math.max(w,h)));
  const ox=Math.round((32-w*k)/2),oy=Math.round((32-h*k)/2);
  rects.forEach(([col,rx,ry,rw,rh])=>{x.fillStyle=col;x.fillRect(ox+(rx-a)*k,oy+(ry-b)*k,rw*k,rh*k);});
  return c;
}

function drawChar(ctx,cx,bottom,flip,phase,hi){
  ctx.save();ctx.translate(cx,bottom);if(flip<0)ctx.scale(-1,1);
  const R=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};

  const bk=BACKS.find(o=>o.id===backId),hd=HANDS.find(o=>o.id===handId);
  if(bk)bk.r.forEach(a=>R(...a));
  if(of&&of.back)of.back.forEach(a=>R(...a));
  const lyL=phase?-2:0, lyR=phase?0:-2;
  R('#000',-8,-5+lyL,6,6);R(paw,-7,-4+lyL,4,4);
  R('#000',2,-5+lyR,6,6);R(paw,3,-4+lyR,4,4);
  R('#000',-11,-15,4,8);R(paw,-10,-14,2,6);
  R('#000',7,-15,4,8);R(paw,8,-14,2,6);
  R('#000',-9,-19,18,16);R(bodyColor,-8,-18,16,14);
  R('rgba(255,255,255,.35)',-8,-18,16,2);R('rgba(0,0,0,.25)',-8,-6,16,2);
  if(of)of.r.forEach(a=>R(...a));
  if(bk&&bk.fr)bk.fr.forEach(a=>R(...a));
  drawHead(ctx,hi);

}

function breedFace(b){
  const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');
  const R=(col,a,y,w,h)=>{x.fillStyle=col;x.fillRect(a,y,w,h);};
  const RR=(col,a,y,w,h)=>{R(col,a,y,w,h);R(col,24-a-w,y,w,h);};
  const fur=b.fur,E=b.earc||shade(fur,-28),muz=b.muz||shade(fur,25),ec=b.eyec||'#111',short=b.mz==='short';
  switch(b.ear){
    case 'floppy':RR(E,2,4,4,10);break;
    case 'long':RR(E,2,5,4,14);RR(E,3,18,3,1);break;
    case 'pointy':RR(E,6,0,2,1);RR(E,5,1,3,2);RR(E,5,3,4,2);RR('#f0a0a0',6,2,1,2);break;
    case 'bat':RR(E,3,0,5,7);RR('#f0a0a0',5,2,2,3);break;
    case 'round':RR(E,4,2,4,4);break;
    case 'rose':RR(E,3,4,4,5);RR(shade(E,-15),4,5,2,3);break;
    case 'curly':RR(E,1,5,5,10);RR(E,0,7,2,6);R(E,7,1,10,5);break;
    case 'fold':RR(E,5,1,4,3);RR(E,4,3,3,4);break;
  }
  R(fur,5,4,14,15);R(fur,4,7,16,9);
  if(b.wide){R(fur,3,8,18,8);R(fur,4,5,16,13);}
  if(b.fluff){RR(fur,3,9,2,7);RR(fur,2,11,1,4);}
  if(b.lower){R(b.lower,5,11,14,8);RR(b.lower,4,11,1,5);}
  if(b.cap){R(b.cap,5,4,14,5);RR(b.cap,4,7,1,3);}
  if(b.blaze)R(b.blaze,11,4,2,9);
  if(b.patch)R(b.patch,5,6,6,6);
  if(b.spots)[[6,6],[16,5],[8,14],[17,13],[12,7],[5,11],[18,9]].forEach(([a,y])=>R(b.spots,a,y,2,2));
  if(b.mz==='long')R(muz,9,12,6,8);else if(short)R(muz,7,13,10,5);else R(muz,8,12,8,7);
  if(b.mask)R(b.mask,short?7:8,12,short?10:8,short?6:7);
  if(b.brows)RR(b.brows,8,7,2,1);
  RR(ec,8,9,2,3);
  if(ec!=='#111')RR('#111',9,10,1,2);
  RR('#fff',8,9,1,1);
  const ny=short?13:12;
  R('#222',10,ny,4,2);R('#222',11,ny+2,2,1);RR('#222',9,ny+3,2,1);
  if(b.tongue!==false)R(b.tonguec||'#e8607a',11,ny+3,2,2);
  const im=x.getImageData(0,0,24,24),px=im.data,out=new Uint8ClampedArray(px);
  const op=(a,y)=>a>=0&&y>=0&&a<24&&y<24&&px[(y*24+a)*4+3]>0;
  for(let y=0;y<24;y++)for(let a=0;a<24;a++){
    const i=(y*24+a)*4;if(px[i+3])continue;
    if(op(a-1,y)||op(a+1,y)||op(a,y-1)||op(a,y+1)){out[i]=26;out[i+1]=26;out[i+2]=46;out[i+3]=255;}
  }
  im.data.set(out);x.putImageData(im,0,0);
  return c;
}

function beep(f,d=0.07,type='square',v=0.05,slide=0){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

const stars=Array.from({length:40},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()<.25?2:1,o:Math.random()*6}));

function addStair(){
  const last=G.stairs[G.stairs.length-1],d=Math.random()<.5?-1:1;
  G.stairs.push({x:last.x+d*SX,dir:d,bone:G.stairs.length>2&&Math.random()<.28});
}
function startGame(){
  G={stairs:[{x:0,dir:0,bone:false}],idx:0,score:0,bones:0,gauge:1,state:'ready',px:0,py:0,camx:0,camy:0,face:1,t:0,flash:0,over:false,rise:[]};
  for(let i=0;i<40;i++)addStair();
  $('over').classList.remove('on');
}
function press(d){
  if(!G||G.over||!$('scrGame').classList.contains('on'))return;
  if(G.state==='ready')G.state='play';
  const nx=G.stairs[G.idx+1];
  G.face=d;
  if(nx.dir!==d){return gameOver('miss');}
  G.idx++;G.score++;G.gauge=Math.min(1,G.gauge+0.12);
  beep(300+(G.score%8)*35,0.06);
  if(nx.bone){nx.bone=false;G.bones++;G.score+=5;G.rise.push({x:nx.x,y:-G.idx*SY-30,t:0});beep(880,0.07,'square',0.05);setTimeout(()=>beep(1320,0.1,'square',0.05),70);}
  while(G.stairs.length<G.idx+40)addStair();
}
function gameOver(why){
  G.over=true;G.flash=0.35;beep(260,0.5,'sawtooth',0.07,-220);
  const isBest=G.score>best;
  if(isBest){best=G.score;try{localStorage.setItem('dogStairsBest',best);}catch(e){}}
  setTimeout(()=>{
    $('overTxt').innerHTML=`${why==='time'?'시간 초과!':'발을 헛디뎠어요!'}<br>점수 <b style="color:#ffd23f">${G.score}</b> (계단 ${G.idx} · 뼈다귀 ${G.bones})<br>${isBest?'🎉 최고 기록!':'최고 기록 '+best}`;
    $('over').classList.add('on');
    submitScore();
  },600);
}
function update(dt){
  if(!G)return;
  if(G.state==='play'&&!G.over){
    G.gauge-=Math.min(0.9,0.25+G.score*0.003)*dt;
    if(G.gauge<=0){G.gauge=0;gameOver('time');}
  }
  const tx=G.stairs[G.idx].x,ty=-G.idx*SY,k=1-Math.exp(-dt*22),kc=1-Math.exp(-dt*9);
  G.px+=(tx-G.px)*k;G.py+=(ty-G.py)*k;
  G.camx+=(G.px-G.camx)*kc;G.camy+=(G.py-G.camy)*kc;
  G.t+=dt;if(G.flash>0)G.flash-=dt;
  G.rise.forEach(r=>r.t+=dt);G.rise=G.rise.filter(r=>r.t<0.7);
}
const scr=(wx,wy)=>[Math.round(W/2+wx-G.camx),Math.round(H*0.66+wy-G.camy)];
const BANDS=['#120c3d','#1b1260','#2a1a80','#40258f','#5c3aa6','#7d52bd'];

function drawBone(x,y){
  const parts=[[0,0,2,2],[0,3,2,2],[7,0,2,2],[7,3,2,2],[2,1,5,3]];
  g.fillStyle='#000';parts.forEach(([a,b,w,h])=>g.fillRect(x+a-1,y+b-1,w+2,h+2));
  g.fillStyle='#fff';parts.forEach(([a,b,w,h])=>g.fillRect(x+a,y+b,w,h));
  g.fillStyle='#d8d2ee';g.fillRect(x+2,y+3,5,1);
}
function txt(s,x,y,size,col,align='left'){
  g.font=`${size}px "Press Start 2P",monospace`;g.textAlign=align;g.textBaseline='top';
  g.fillStyle='#000';g.fillText(s,x+1,y+1);g.fillStyle=col;g.fillText(s,x,y);
}
function draw(){
  BANDS.forEach((c,i)=>{g.fillStyle=c;g.fillRect(0,Math.round(i*H/6),W,Math.ceil(H/6)+1);});
  const par=G.camy*0.06;
  stars.forEach(s=>{const y=((s.y-par)%H+H)%H;g.fillStyle=Math.sin(G.t*3+s.o)>0?'#fff':'#9a8fd8';g.fillRect(Math.round(s.x),Math.round(y),s.s,s.s);});
  g.fillStyle='#fff6c0';g.fillRect(180,50,16,20);g.fillRect(176,54,24,12);
  for(let i=0;i<3;i++){const cy=((60+i*140-G.camy*0.2)%(H+60)+H+60)%(H+60)-30,cx=((i*97+G.t*6)%(W+80))-40;
    g.fillStyle='rgba(255,255,255,.18)';g.fillRect(Math.round(cx),Math.round(cy),40,8);g.fillRect(Math.round(cx)+8,Math.round(cy)-6,22,6);}
  const hi=Math.min(G.stairs.length-1,G.idx+16),lo=Math.max(0,G.idx-8);
  for(let i=hi;i>=lo;i--){
    const s=G.stairs[i],[sx,sy]=scr(s.x,-i*SY),w=SW;
    g.fillStyle='#000';g.fillRect(sx-w/2-1,sy-1,w+2,13);
    g.fillStyle='#ffcf6e';g.fillRect(sx-w/2,sy,w,4);
    g.fillStyle='#d98a3d';g.fillRect(sx-w/2,sy+4,w,6);
    g.fillStyle='#a8602a';g.fillRect(sx-w/2,sy+8,w,2);
    if(s.bone)drawBone(sx-4,sy-11+Math.round(Math.sin(G.t*5+i)));
  }
  const [px,py]=scr(G.px,G.py),dist=Math.hypot(G.stairs[G.idx].x-G.px,-G.idx*SY-G.py);
  const hop=Math.sin(Math.min(1,dist/26)*Math.PI)*5;
  drawChar(g,px,Math.round(py-hop),G.face,G.idx&1);
  G.rise.forEach(r=>{const [rx,ry]=scr(r.x,r.y-r.t*20);txt('+5',rx,ry,8,'#ffd23f','center');});
  if(G.demo)return;
  // HUD
  txt(String(G.score),W/2,10,18,'#fff','center');
  drawBone(10,10);txt('x'+G.bones,24,10,8,'#fff');
  txt('BEST '+best,W-8,10,8,'#ffd23f','right');
  g.fillStyle='#000';g.fillRect(18,40,204,14);g.fillStyle='#333';g.fillRect(20,42,200,10);
  g.fillStyle=G.gauge>.5?'#5ee07a':G.gauge>.25?'#ffd23f':'#ff5a5a';g.fillRect(20,42,Math.round(200*G.gauge),10);
  if(G.state==='ready'&&Math.floor(G.t*2)%2===0)txt('TAP < >',W/2,H*0.4,12,'#fff','center');
  if(G.flash>0){g.fillStyle=`rgba(255,60,60,${G.flash})`;g.fillRect(0,0,W,H);}
}
let lastT=performance.now();
// 첫 화면 배경: 강아지가 알아서 계단을 오르는 데모
let DEMO=null,demoT=0;
const bgx=$('bgCv').getContext('2d');bgx.imageSmoothingEnabled=false;
function demoTick(dt){
  const sG=G,sg=g;G=DEMO;g=bgx;
  try{
    if(!G){
      G=DEMO={stairs:[{x:0,dir:0,bone:false}],idx:0,score:0,bones:0,gauge:1,state:'play',px:0,py:0,camx:0,camy:0,face:1,t:0,flash:0,over:false,rise:[],demo:true};
      for(let i=0;i<40;i++)addStair();
    }
    demoT+=dt;
    if(demoT>0.26){demoT=0;const nx=G.stairs[G.idx+1];G.face=nx.dir;G.idx++;G.score++;nx.bone=false;while(G.stairs.length<G.idx+40)addStair();}
    update(dt);draw();DEMO=G;
  }finally{G=sG;g=sg;}
}
(function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  if(G&&$('scrGame').classList.contains('on')){update(dt);draw();}
  else if($('scrLogin').classList.contains('on'))demoTick(dt);
  requestAnimationFrame(loop);
})(lastT);

function applyLook(l){
  const br=BREEDS.find(x=>x.n===l.b)||BREEDS[0];br._c=br._c||breedFace(br);
  curBreed=br.n;face={hi:br._c,lo:br._c,pixel:true};facePos={dx:0,dy:0,s:1};
  worn=(l.w||[]).filter(a=>ITEMS.some(i=>i.id===a[0])).map(a=>({id:a[0],dx:a[1],dy:a[2]}));
  outfitId=l.o||null;handId=l.h||null;backId=l.k||null;bodyColor=l.c||bodyColor;selId=null;

function authMsg(e){
  const c=(e&&e.code)||'';
  if(c==='auth/email-already-in-use')return '이미 있는 닉네임이에요. 다른 닉네임을 써 주세요.';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials')return '닉네임 또는 비밀번호가 틀렸어요.';
  if(c==='auth/weak-password')return '비밀번호는 6자 이상이어야 해요.';
  if(c==='auth/too-many-requests')return '시도가 너무 많아요. 잠시 후 다시 해 주세요.';
  if(c==='auth/network-request-failed')return '네트워크 연결을 확인해 주세요.';
  if(c==='auth/operation-not-allowed')return 'Firebase에서 이메일/비밀번호 로그인이 꺼져 있어요. (설정방법.md 확인)';
  return '오류가 났어요: '+(c||e.message);
}
// Firebase는 6자 이상 비밀번호만 받아서, 6자리 숫자를 닉네임과 섞어 긴 값으로 바꿔서 보내요 (원래 숫자는 서버에 안 가요)
async function derive(nick,pin){
  const t='dogstairs|'+nick.trim().toLowerCase()+'|'+pin;
  if(!(window.crypto&&crypto.subtle))throw new Error('https 주소에서만 로그인할 수 있어요');
  const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return Array.prototype.map.call(new Uint8Array(h),b=>b.toString(16).padStart(2,'0')).join('');
}

async function doAuth(mode){
  const nick=$('nick').value.trim(),pw=$('pw').value,msg=t=>{$('loginMsg').textContent=t;};
  if(!hasDB())return msg('랭킹 서버가 아직 연결되지 않았어요. 게스트로 시작해 주세요.');
  if(mode==='signup'&&!signupMode){setSignupMode(true);return msg('사용할 닉네임과 비밀번호를 적고 "만들기"를 눌러 주세요.');}
  if(!NICK_RE.test(nick))return msg('닉네임은 2~8글자 (한글/영문/숫자/_ 만 가능)');
  if(!/^\d{6}$/.test(pw))return msg('비밀번호는 숫자 6자리예요.');
  msg('잠깐만요…');
  try{
    let exists=null;
    try{exists=(await window.DB.byNick(nick)).length>0;}catch(e){}
    if(mode==='login'&&exists===false)return msg('없는 닉네임이에요. "새로 만들기"로 회원가입해 주세요.');
    if(mode==='signup'&&exists===true){setSignupMode(false);return msg('이미 있는 닉네임이에요. 로그인해 주세요.');}
    await window.DB[mode](nick,await derive(nick,pw));msg('');
  }catch(e){
    if(mode==='signup'&&e&&e.code==='auth/email-already-in-use'){setSignupMode(false);return msg('이미 있는 닉네임이에요. 로그인해 주세요.');}
    if(mode==='login'&&e&&(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/invalid-login-credentials'))return msg('비밀번호가 틀렸어요.');
    msg(authMsg(e));
  }
}

  const keep={face,facePos,worn,outfitId,handId,backId,bodyColor,selId,curBreed};
  try{
    applyLook(lookStr?JSON.parse(lookStr):{b:'믹스견',w:[]});
    const c=cv.getContext('2d');
    c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);c.imageSmoothingEnabled=false;c.setTransform(k,0,0,k,0,0);
    drawChar(c,cv.width/k/2,cv.height/k-2,1,0,k>=4);
  }catch(e){}
  ({face,facePos,worn,outfitId,handId,backId,bodyColor,selId,curBreed}=keep);
}
async function openProfile(r){
  pfCur=r;show('scrProfile');$('pfMsg').textContent='';
  $('pfNick').textContent=r.nick;drawLook($('pfCv'),r.look,6);
  $('pfScore').textContent=r.score>0?`${r.score}점 · 계단 ${r.stairs} · 뼈다귀 ${r.bones}`:'아직 기록이 없어요';
  if(r.score>0&&hasDB()){try{$('pfScore').textContent+=` · ${await window.DB.rankOf(r.score)}위`;}catch(e){}}
}
$('btnPfShare').onclick=async()=>{
  if(!pfCur)return;
  const url=location.href.split('?')[0].split('#')[0]+'?u='+encodeURIComponent(pfCur.nick);
  const text=`${pfCur.nick}의 무한의 멍계단 기록: ${pfCur.score}점!`;
  try{if(navigator.share){await navigator.share({title:'무한의 멍계단',text,url});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(url);$('pfMsg').textContent='링크가 복사됐어요! 친구에게 붙여넣기 하세요.';}
  catch(e){$('pfMsg').textContent=url;}
};
$('btnPfBack').onclick=()=>{me?enterStart():show('scrLogin');};
window.addEventListener('dbready',async()=>{
  const u=new URLSearchParams(location.search).get('u');
  if(u&&hasDB()){try{const r=(await window.DB.byNick(u))[0];if(r)openProfile(r);}catch(e){}}
});
</script>
<script src="firebase-config.js" onerror="window.FIREBASE_CONFIG=window.FIREBASE_CONFIG||null"></script>
<script type="module">
(async()=>{
const cfg=window.FIREBASE_CONFIG,fire=(n,d)=>{try{window.dispatchEvent(new CustomEvent(n,{detail:d}));}catch(e){}};
let DB={enabled:false};
try{
  if(!(cfg&&cfg.apiKey))throw new Error('firebase-config.js 가 비어 있어요 (게스트 모드)');
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  const {initializeApp}=await import(B+'firebase-app.js');
  const au=await import(B+'firebase-auth.js');
  const fs=await import(B+'firebase-firestore.js');
  const app=initializeApp(cfg),auth=au.getAuth(app),db=fs.getFirestore(app),col=fs.collection(db,'scores');
  // 닉네임 -> 가짜 이메일 (이메일 없이 닉네임+비밀번호로 가입하기 위함)
  const toEmail=n=>'u'+[...new TextEncoder().encode(n.trim().toLowerCase())].map(b=>b.toString(16).padStart(2,'0')).join('')+'@dogstairs.app';
  const cur=()=>auth.currentUser?{uid:auth.currentUser.uid,nick:auth.currentUser.displayName||'?'}:null;
  const rows=sn=>sn.docs.map(d=>({id:d.id,...d.data()}));
  let busy=false;
  DB={enabled:true,
    async signup(nick,pw){
      busy=true;
      try{
        const c=await au.createUserWithEmailAndPassword(auth,toEmail(nick),pw);
        await au.updateProfile(c.user,{displayName:nick});
        await fs.setDoc(fs.doc(db,'scores',c.user.uid),{nick,nickLower:nick.toLowerCase(),score:0,stairs:0,bones:0,look:null,updatedAt:fs.serverTimestamp()});
      }finally{busy=false;}
      fire('authchange',cur());
    },
    login(nick,pw){return au.signInWithEmailAndPassword(auth,toEmail(nick),pw);},
    logout(){return au.signOut(auth);},
    async submit(score,stairs,bones,look){
      const u=auth.currentUser;if(!u)return null;
      const ref=fs.doc(db,'scores',u.uid),snap=await fs.getDoc(ref),old=snap.exists()?snap.data().score:0,updated=score>old;
      if(updated)await fs.setDoc(ref,{nick:u.displayName,nickLower:u.displayName.toLowerCase(),score,stairs,bones,look:JSON.stringify(look),updatedAt:fs.serverTimestamp()});
      const best=Math.max(old,score);
      return{updated,best,rank:await DB.rankOf(best)};
    },
    async saveLook(look){const u=auth.currentUser;if(!u)return;await fs.updateDoc(fs.doc(db,'scores',u.uid),{look:JSON.stringify(look)});},
    async getLook(){const u=auth.currentUser;if(!u)return null;const sn=await fs.getDoc(fs.doc(db,'scores',u.uid));return sn.exists()?sn.data().look||null:null;},
    async rankOf(score){const c=await fs.getCountFromServer(fs.query(col,fs.where('score','>',score)));return c.data().count+1;},
    top(cb){return fs.onSnapshot(fs.query(col,fs.orderBy('score','desc'),fs.limit(30)),sn=>cb(rows(sn)),er=>{console.error('[랭킹 읽기 실패]',er);DB.lastErr=er.code||er.message;cb(null);});},
    async search(q){const l=q.trim().toLowerCase();return rows(await fs.getDocs(fs.query(col,fs.where('nickLower','>=',l),fs.where('nickLower','<=',l+'\uf8ff'),fs.limit(10))));},
    async byNick(n){return rows(await fs.getDocs(fs.query(col,fs.where('nickLower','==',n.trim().toLowerCase()),fs.limit(1))));},
  };
  au.onAuthStateChanged(auth,()=>{if(!busy)fire('authchange',cur());});
}catch(e){console.warn('[랭킹 꺼짐]',e.message);}
window.DB=DB;fire('dbready',DB.enabled);
})();
</script>
